name: appcenter_sdk_plus
description: "AppCenter SDK written purely in Flutter with support for AppCenter Analytics and AppCenter Crashes."
version: 1.0.8
repository: https://github.com/octavian-h/appcenter_sdk_plus

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  device_info_plus: ^13.3.0
  http: ^1.6.0
  logging: ^1.3.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  sqlite3_async: ^1.1.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
